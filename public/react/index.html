<script>
(function(){
  function fixIfBare(url) {
    try {
      var a = document.createElement("a");
      a.href = url;
      if (a.pathname === "/public") {
        return "/public/" + a.search + a.hash;
      }
    } catch(e) {}
    return url;
  }
  if (window.location.pathname === "/public") {
    var newUrl = "/public/" + window.location.search + window.location.hash;
    window.history.replaceState(window.history.state, "", newUrl);
  }
  ["pushState","replaceState"].forEach(function(method){
    var orig = window.history[method];
    window.history[method] = function(state, title, url) {
      if (typeof url === "string") {
        url = fixIfBare(url);
      }
      return orig.call(window.history, state, title, url);
    };
  });
})();
</script>
